#alphafold3_predictions_multigpu

#--export=ALL,TMPDIR=__TMPDIR__
#this is a test 

executor: cluster-generic

cluster-generic-submit-cmd:
  XDG_CACHE_HOME=__CACHE__

  sbatch
    --job-name=__POS__
    --ntasks={threads}
    --mem-per-cpu=`expr {resources.mem_mb} / {threads}`
    --time={resources.runtime}
    $SMK_SLURM_GID_OPTION
    --output=__OUT__/out.txt
    $SMK_SLURM_EXTRA
    --parsable
    

cluster-generic-status-cmd: __STATUS_CMD__
cluster-generic-cancel-cmd: scancel
cluster-generic-cancel-nargs: 1000
default-resources:
  runtime: 1h
  mem_mb: 1024
  disk_mb: 51200
  slurm_extra: "''"
restart-times: 0
max-jobs-per-second: 10
max-status-checks-per-second: 1
local-cores: 1
latency-wait: 60
jobs: 4
keep-going: true
rerun-incomplete: true
printshellcmds: true
scheduler: greedy
cores: 64

