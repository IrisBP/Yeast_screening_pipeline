executor: cluster-generic
cluster-generic-submit-cmd:
  SMK_RULE_DIR=__CLUSTER_LOG_ROOT__/`date +"%y-%m-%d"`/{rule} &&
  SMK_WILDCARDS=`echo -n '{wildcards}' | sed -e 's#/#-#g'` &&
  SMK_SLURM_EXTRA=`echo -n '{resources.slurm_extra}' | sed -e 's/%/:/g'` &&
  SMK_SLURM_GID_OPTION="__SLURM_GID_OPTION__"  &&
  mkdir -p $SMK_RULE_DIR &&
  sbatch
    --job-name={rule}:{wildcards}
    --ntasks={threads}
    --mem-per-cpu=`expr {resources.mem_mb} / {threads}`
    --time={resources.runtime}
    $SMK_SLURM_GID_OPTION
    --export=ALL,TMPDIR=__TMPDIR__
    --output=$SMK_RULE_DIR/{rule}:$SMK_WILDCARDS-%j.txt
    $SMK_SLURM_EXTRA
    --parsable
cluster-generic-status-cmd: __STATUS_CMD__
cluster-generic-cancel-cmd: scancel
cluster-generic-cancel-nargs: 1000
default-resources:
  runtime: 1h
  mem_mb: 1024
  disk_mb: 51200
  slurm_extra: "''"
restart-times: 0
max-jobs-per-second: 10
max-status-checks-per-second: 1
local-cores: 1
latency-wait: 60
jobs: 4
keep-going: true
rerun-incomplete: true
printshellcmds: true
scheduler: greedy
cores: 64


set-resources:
  alphafold3_msas:
    runtime: "4h"
    mem_mb: 65536
    slurm_extra: "'--partition=slurm'"
  alphafold3_predictions:
    runtime: "24h"
    mem_mb: 131072
    slurm_extra: "'--partition=slurm --gpus=nvidia_rtx_pro_6000_blackwell_workstation_edition:1'"
  boltz_predict:
    runtime: "4h"
    mem_mb: 65536
    slurm_extra: "'--partition=slurm --gpus=nvidia_rtx_pro_6000_blackwell_workstation_edition:1'"
  colabfold_msas:
    runtime: "7-00:00:00"
    mem_mb: 196608
    slurm_extra: "'--partition=slurm'"
  colabfold_predictions:
    runtime: "3-00:00:00"
    mem_mb: 65536
    slurm_extra: "'--partition=slurm --gpus=nvidia_rtx_pro_6000_blackwell_workstation_edition:1'"
  helixfold3_run_infer:
    runtime: "4h"
    mem_mb: 65536
    slurm_extra: "'--partition=slurm --gpus=nvidia_rtx_pro_6000_blackwell_workstation_edition:1'"
  openfold_precompute_alignments: